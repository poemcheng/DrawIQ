<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10263a">
  <title>DrawIQ 0.11.0｜報價工作台</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="app-header">
    <div class="app-title">
      <span class="wordmark">DrawIQ</span>
      <h1>報價工作台</h1>
      <span class="version">0.11.0 網頁版</span>
    </div>
    <a class="desktop-link" id="desktop-link" href="https://github.com/poemcheng/DrawIQ/releases/tag/v0.11.0">下載桌面版</a>
  </header>

  <main class="workspace">
    <section class="document-bar" aria-label="檔案與辨識">
      <div class="file-actions">
        <label class="button primary" for="file-input">開啟圖面</label>
        <input class="visually-hidden" id="file-input" type="file"
          accept="application/pdf,image/png,image/jpeg,image/webp,image/bmp,.pdf,.png,.jpg,.jpeg,.webp,.bmp">
        <button id="load-example" type="button">開啟範例</button>
        <button id="run-ocr" type="button">辨識本頁</button>
      </div>
      <div class="document-summary">
        <strong id="document-name">尚未開啟檔案</strong>
        <span>PDF 或圖片 · 檔案在瀏覽器中處理</span>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>

    <div class="workbench">
      <section class="pane form-pane" aria-labelledby="fields-title">
        <header class="pane-header">
          <div>
            <h2 id="fields-title">耐落報價標籤</h2>
            <p>選取欄位後可手填或在圖面框選。</p>
          </div>
        </header>
        <div class="field-list" id="fields"></div>
        <footer class="pane-footer">
          <button class="primary full-width" id="approve" type="button">核准報價標籤</button>
        </footer>
      </section>

      <section class="pane drawing-pane" aria-labelledby="drawing-title">
        <header class="pane-header drawing-header">
          <h2 id="drawing-title">圖面</h2>
          <div class="drawing-tools">
            <div class="pagination" aria-label="頁次">
              <button id="prev-page" type="button" aria-label="上一頁">‹</button>
              <span id="page-status" aria-live="polite">—</span>
              <button id="next-page" type="button" aria-label="下一頁">›</button>
            </div>
            <label class="box-control"><input id="show-boxes" type="checkbox" checked>顯示標註</label>
            <button id="enable-crop" type="button" aria-pressed="false">框選並辨識</button>
          </div>
        </header>
        <div class="drawing-scroll">
          <div id="drawing-stage" class="drawing-stage" data-ready="false">
            <div class="drawing-placeholder" id="drawing-placeholder">
              <div class="sheet-icon" aria-hidden="true"></div>
              <p>開啟圖面以開始辨識</p>
              <small>可先開啟範例練習框選與核准</small>
            </div>
            <canvas id="drawing" aria-label="目前圖面"></canvas>
            <svg id="overlay" xmlns="http://www.w3.org/2000/svg" aria-label="辨識標註" preserveAspectRatio="none"></svg>
          </div>
        </div>
      </section>

      <section class="pane results-pane" aria-labelledby="results-title">
        <header class="pane-header">
          <div>
            <h2 id="results-title">辨識結果</h2>
            <p id="ocr-engine">Tesseract.js（繁中／英文）</p>
          </div>
        </header>
        <div class="result-list" id="results" aria-label="辨識文字">
          <p id="result-placeholder" class="empty-state">完成辨識後，文字會顯示在這裡。</p>
        </div>
      </section>
    </div>
  </main>

  <dialog id="final-dialog" aria-labelledby="final-title">
    <header class="dialog-header">
      <h2 id="final-title">確認報價標籤</h2>
      <p>檢查辨識值，並填寫需要的報價資訊。</p>
    </header>
    <div class="dialog-body final-fields" id="final-fields"></div>
    <footer class="dialog-actions">
      <button id="cancel-final" type="button">返回編輯</button>
      <button class="primary" id="finish-final" type="button">核准並輸出圖片</button>
    </footer>
  </dialog>

  <dialog id="export-dialog" aria-labelledby="export-title">
    <header class="dialog-header">
      <h2 id="export-title">報價標籤圖片</h2>
    </header>
    <div class="dialog-body export-body">
      <img id="export-preview" alt="已核准的耐落報價標籤">
      <p id="export-status" role="status"></p>
    </div>
    <footer class="dialog-actions">
      <button id="close-export" type="button">關閉</button>
      <button id="copy-png" type="button">複製圖片</button>
      <button class="primary" id="save-png" type="button">下載 PNG</button>
    </footer>
  </dialog>

  <noscript><p class="noscript">請啟用 JavaScript 以操作 DrawIQ 工作台。</p></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
